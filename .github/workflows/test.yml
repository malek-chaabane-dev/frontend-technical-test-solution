name: Check tests with Jest

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version-file: '.nvmrc'
    - run: npm ci
    - run: npx tsc --noEmit
    - run: npm run lint
    - run: npm test -- --runInBand
    - run: npm run build